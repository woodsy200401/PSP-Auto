name: Build PSP Auto

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build PSP application
        run: |
          docker run --rm -v "$PWD:/src" -w /src pspdev/pspdev:latest sh -c 'make clean || true; make'

      - name: Upload PSP executable
        uses: actions/upload-artifact@v4
        with:
          name: PSPAuto-PPSSPP
          path: EBOOT.PBP
          if-no-files-found: error
